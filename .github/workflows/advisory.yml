name: Advisory analysis

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Workflow-level env does not cross workflow boundaries, so ci.yml's cap
  # does not reach here. Uncapped, this namespace grows to ccache's 5 GiB
  # default against a 10 GB repository quota.
  CCACHE_MAXSIZE: 250M
  CC: clang
  CXX: clang++

jobs:
  clang-tidy:
    name: Advisory clang-tidy
    runs-on: ubuntu-24.04
    # The build step gets 75 minutes, matching the required full-tree sweep
    # in ci.yml: this profile analyzes the same targets with more checks.
    # The job ceiling adds headroom for setup and cache saving. Under the
    # earlier limit of 45 the then-serial build was cancelled every week; a
    # cancelled job also saves no compiler cache, so every run started cold.
    timeout-minutes: 85
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-dev-clang-tidy-advisory--${{ github.sha }}
          restore-keys: ccache-dev-clang-tidy-advisory--

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          clang-tidy-18 --version
          clang-tidy-18 --version | grep -Eq 'LLVM version 18\.'
          ccache --version

      - name: Configure
        run: >-
          cmake --preset dev-clang-tidy-advisory
          -DTESS_CLANG_TIDY_EXE=clang-tidy-18

      # Same bound as the required sweep. The preset's default generator
      # builds one translation unit at a time when no level is given.
      # Time out the build before the job ceiling so a slow sweep
      # reports failure instead of being cancelled.
      - name: Build with bounded parallelism
        timeout-minutes: 75
        run: cmake --build --preset dev-clang-tidy-advisory --parallel 4

  report-failure:
    name: Report advisory analysis failures
    needs: [clang-tidy]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: advisory-failure-report
      queue: max
    permissions:
      issues: write

    steps:
      - name: Update advisory failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RESULT: ${{ needs.clang-tidy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$ANALYSIS_RESULT" in
            failure)
              gh label create advisory-failure --force \
                --description "Advisory analysis tooling failure or timeout" \
                --color B60205 --repo "$GITHUB_REPOSITORY"
              ;;
            success) ;;
            *) exit 0 ;;
          esac

          # If several issues are open, update the oldest.
          issue=$(gh issue list --state open --label advisory-failure \
            --search 'sort:created-asc' --limit 1 --json number \
            --jq '.[].number' --repo "$GITHUB_REPOSITORY")
          if [[ "$ANALYSIS_RESULT" == success ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "Advisory analysis passed: $RUN_URL" \
                --repo "$GITHUB_REPOSITORY"
            fi
          else
            body="Advisory analysis failed in job \`clang-tidy\`: $RUN_URL"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body" --repo "$GITHUB_REPOSITORY"
            else
              gh issue create --title "Advisory analysis failing on main" \
                --label advisory-failure --body "$body" --repo "$GITHUB_REPOSITORY"
            fi
          fi
