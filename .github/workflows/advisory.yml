name: Advisory analysis

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Workflow-level env does not cross workflow boundaries, so ci.yml's cap
  # does not reach here. Uncapped, this namespace grows to ccache's 5 GiB
  # default against a 10 GB repository quota.
  CCACHE_MAXSIZE: 250M
  CC: clang
  CXX: clang++

jobs:
  clang-tidy:
    name: Advisory clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-dev-clang-tidy-advisory--${{ github.sha }}
          restore-keys: ccache-dev-clang-tidy-advisory--

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          clang-tidy-18 --version
          clang-tidy-18 --version | grep -Eq 'LLVM version 18\.'
          ccache --version

      - name: Configure
        run: >-
          cmake --preset dev-clang-tidy-advisory
          -DTESS_CLANG_TIDY_EXE=clang-tidy-18

      - name: Build
        run: cmake --build --preset dev-clang-tidy-advisory
