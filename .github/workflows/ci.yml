name: CI

# Tiered per docs/planning/test-and-benchmark-redesign.md section 5 and
# docs/planning/ci-failure-classification-2026-07-28.md: pull requests
# run the blocking set (dev, GCC, hooks, ASan, cppcheck, Windows, bench
# compile+smoke, diff-scoped clang-tidy, path-filtered TSan); pushes to
# main, the weekly schedule, and manual dispatches additionally run the
# full matrix (werror, TSan, full-tree clang-tidy, release, macOS) and
# the benchmark threshold gates; baseline artifact collection runs on
# main pushes only, in its own non-gating job, so change-point sees
# exactly one artifact set per merged commit's run.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag selected for the release-mode dispatch
        required: false
        type: string
      expected_version:
        description: Complete expected version, including prerelease label
        required: false
        type: string
      expected_sha:
        description: Full expected commit SHA
        required: false
        type: string

permissions:
  actions: read
  contents: read

# The event name keeps a scheduled full run from cancelling an in-flight
# main push run sharing the same ref.
concurrency:
  group: >-
    ci-${{ github.event_name }}-${{ inputs.expected_sha || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # CI3: ccache defaults to a 5 GiB cache. Ten namespaces at that
  # ceiling overrun the 10 GB repository quota and thrash caches.
  # Cap each one well inside it.
  CCACHE_MAXSIZE: 250M

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code_required: ${{ steps.classify.outputs.code_required }}
      tsan_required: ${{ steps.classify.outputs.tsan_required }}
      perf_required: ${{ steps.classify.outputs.perf_required }}
      quality_presets: ${{ steps.classify.outputs.quality_presets }}
      release_mode: ${{ steps.release.outputs.release_mode }}
      tested_sha: ${{ steps.release.outputs.tested_sha }}
    steps:
      # Manual inputs are claims, not checkout authority. Bind all executable
      # repository content to the event/workflow commit before validating the
      # optional release tuple.
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release inputs and checked-out identity
        id: release
        env:
          DISPATCH_REF: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ inputs.ref }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          supplied=0
          [ -n "$RELEASE_REF" ] && supplied=$((supplied + 1))
          [ -n "$EXPECTED_VERSION" ] && supplied=$((supplied + 1))
          [ -n "$EXPECTED_SHA" ] && supplied=$((supplied + 1))
          actual_sha="$(git rev-parse HEAD)"
          if [ "$supplied" -eq 0 ]; then
            echo "release_mode=false" >> "$GITHUB_OUTPUT"
            echo "tested_sha=$actual_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$supplied" -ne 3 ]; then
            echo "release mode requires ref, expected_version, and expected_sha" >&2
            exit 1
          fi
          test "$RELEASE_REF" = "$DISPATCH_REF"
          test "$EVENT_SHA" = "$EXPECTED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_SHA"
          test "$actual_sha" = "$EXPECTED_SHA"
          version="$(sed -n 's/^set(TESS_VERSION \([^)]*\))$/\1/p' \
            cmake/tess-version.cmake)"
          prerelease="$(sed -n \
            's/^set(TESS_VERSION_PRERELEASE "\([^"]*\)")$/\1/p' \
            cmake/tess-version.cmake)"
          [ -z "$prerelease" ] || version="$version-$prerelease"
          test "$version" = "$EXPECTED_VERSION"
          echo "release_mode=true" >> "$GITHUB_OUTPUT"
          echo "tested_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      # Scheduled and dispatched runs have no comparison range and fail
      # closed to the full tier inside the classifier.
      - name: Classify changed paths
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python3 tools/ci_changes.py
          "${PR_BASE_SHA:-$PUSH_BASE_SHA}" "$HEAD_SHA"
          --event "$EVENT_NAME"
          >> "$GITHUB_OUTPUT"

  dev:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: Dev Build And Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-dev--${{ github.sha }}
          restore-keys: ccache-dev--

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          ccache --version

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

      - name: Test
        run: ctest --preset dev

      # Consumer contract (redesign section 10 item 5): every public
      # header compiles standalone, and the macro-configuration matrix
      # builds — including the mixed-adapter cells no preset covers.
      - name: Standalone public headers
        run: cmake --build build/dev --target tess_verify_interface_header_sets

      - name: Macro-configuration matrix
        run: cmake --build build/dev --target tess_contract_cells

      # The pre-push hook selects tests by these labels (redesign
      # section 6); this asserts CMake actually attached them where a
      # configured build exists.
      - name: Verify pre-push label propagation
        run: |
          ctest --test-dir build/dev --show-only=json-v1 \
            > build/dev/ctest-labels.json
          python3 - <<'EOF'
          import json
          payload = json.load(open("build/dev/ctest-labels.json"))
          seen = set()
          path_labels = set()
          for test in payload["tests"]:
            props = {p["name"]: p.get("value")
                     for p in test.get("properties", [])}
            labels = set()
            for entry in props.get("LABELS") or []:
              labels |= set(entry.split(";"))
            seen |= labels
            if "target:tess_path_test" in labels:
              path_labels |= labels
          assert "prepush:always" in seen, seen
          assert {"subsystem:path", "target:tess_path_test"} <= \
            path_labels, path_labels
          print(f"{len(seen)} distinct labels propagated")
          EOF

      # Shadow-mode counter goldens (redesign section 3.3): the ctest
      # fixture pair above never fails on drift, but drift must be seen
      # even when an unrelated step fails.
      - name: Surface counter-golden drift
        if: ${{ always() }}
        run: |
          if [ -f build/dev/tests/counter-golden-drift.md ]; then
            cat build/dev/tests/counter-golden-drift.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Example smoke
        run: |
          ran=0
          for example in build/dev/examples/tess_*; do
            [ -x "$example" ] || continue
            echo "::group::$(basename "$example")"
            args=()
            case "$(basename "$example")" in
              tess_web_traffic_model|tess_web_traffic_diagnostics_model)
                args=(--self-check-smoke)
                ;;
            esac
            "$example" "${args[@]}"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          # EXACT, not a floor: the dev preset builds 22 examples, and a
          # floor of 13 passed while one of them silently stopped building.
          # Bump this when adding an example -- a failure here means either
          # a new example or a missing one, and both want a human.
          test "$ran" -eq 22

      # Documented example output is copied from real program runs; drift
      # between the docs and the compiled quickstart fails the build.
      - name: Documentation example output
        run: >-
          python3 tools/check_doc_outputs.py
          examples/quickstart.cc=build/dev/examples/tess_quickstart

      - name: Install smoke
        run: tools/install_smoke.sh

      - name: FetchContent consumer smoke
        run: tools/fetchcontent_smoke.sh

  # GCC floor and current-toolchain portability, warning, and runtime gates.
  gcc:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: GCC ${{ matrix.version }} Build And Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "12"
            cc: gcc-12
            cxx: g++-12
          - version: "14"
            cc: gcc-14
            cxx: g++-14
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-gcc-${{ matrix.version }}--${{ github.sha }}
          restore-keys: ccache-gcc-${{ matrix.version }}--

      - name: Show tool versions
        run: |
          cmake --version
          "$CXX" --version
          test "$("$CXX" -dumpversion | cut -d. -f1)" = \
            "${{ matrix.version }}"

      - name: Configure
        run: cmake --preset dev-werror

      - name: Build
        run: cmake --build --preset dev-werror

      - name: Test
        run: ctest --preset dev-werror

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

  # CI10: on a pull request the library was never COMPILED against libc++.
  # macOS covers it, but macOS is main-only, so a libc++-specific failure
  # reached main before anyone saw it. Compile-only, mirroring the gcc
  # portability cell's cost profile rather than adding a second test run.
  libcxx:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: libc++ Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -stdlib=libc++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install libc++ and ccache
        run: |
          tools/install_ci_ccache.sh
          tools/ci_apt_install.sh libc++-dev libc++abi-dev

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-libcxx--${{ github.sha }}
          restore-keys: ccache-libcxx--

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version

      - name: Configure
        run: cmake --preset dev-werror

      - name: Build
        run: cmake --build --preset dev-werror

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

  no-exceptions:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: Exception-Free (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each cache fallback comes from a sibling job using the same compiler;
        # compiler identity is part of the ccache key.
        include:
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            preset: dev-asan
            cache_fallback: ccache-dev-asan--
            exclude_test: 'Legacy.*CapacityFailureAborts'
          - name: GCC Werror
            cc: gcc-14
            cxx: g++-14
            preset: dev-werror
            cache_fallback: ccache-gcc-14--
            exclude_test: '^$'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-noexceptions-${{ matrix.preset }}--${{ github.sha }}
          # Falls back to a sibling namespace built by the same compiler
          # (see the matrix note). This job adds exception-free targets but
          # does not change the flags of the objects it shares, and ccache
          # keys on both flags and compiler, so a stale hit is impossible —
          # only a warm start that avoids a second copy of the same objects.
          restore-keys: |
            ccache-noexceptions-${{ matrix.preset }}--
            ${{ matrix.cache_fallback }}

      - name: Show tool versions
        run: |
          cmake --version
          "$CXX" --version
          ccache --version

      - name: Configure validation targets
        run: >-
          cmake --preset "${{ matrix.preset }}"
          -DTESS_BUILD_NO_EXCEPTIONS_TESTING=ON

      - name: Build exception-free contracts
        run: |
          cmake --build "build/${{ matrix.preset }}" --parallel \
            --target tess_no_exceptions_test \
              tess_no_exceptions_consumer_contract_test \
              tess_no_exceptions_headers_verify_interface_header_sets \
              tess_no_exceptions_contract_cells \
              tess_block_test \
              tess_consumer_contract_test \
              tess_maintenance_contract_test \
              tess_maintenance_test \
              tess_chunk_maintenance_test \
              tess_path_cache_test \
              tess_phase_executor_test \
              tess_sim_auto_exec_test \
              tess_sim_schedule_test \
              tess_storage_test \
              tess_topology_test

      - name: Run exception-free behavior
        run: >-
          ctest --test-dir "build/${{ matrix.preset }}"
          --output-on-failure --no-tests=error
          -L config:noexceptions
          -E "${{ matrix.exclude_test }}"

      - name: Compare exception-mode subsystem manifests
        run: >-
          python3 tools/check_no_exceptions_manifest.py
          --ctest-dir "build/${{ matrix.preset }}"

      - name: Build exception-free examples
        run: |
          cmake --preset examples-no-exceptions
          cmake --build --preset examples-no-exceptions --parallel

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

      - name: Run exception-free examples
        run: |
          ran=0
          for example in build/examples-no-exceptions/examples/tess_*; do
            [ -x "$example" ] || continue
            args=()
            case "$(basename "$example")" in
              tess_web_traffic_model|tess_web_traffic_diagnostics_model)
                args=(--self-check-smoke)
                ;;
            esac
            "$example" "${args[@]}" > /dev/null
            ran=$((ran + 1))
          done
          # This preset disables the two optional ECS integrations, so its
          # controlled inventory is the other 20 example executables.
          test "$ran" -eq 20

      - name: Exception-free installed consumer
        env:
          TESS_INSTALL_SMOKE_BUILD_DIR: build/${{ matrix.preset }}
          TESS_NO_EXCEPTIONS: 1
        run: tools/install_smoke.sh

      - name: Exception-free FetchContent consumer
        env:
          TESS_NO_EXCEPTIONS: 1
        run: tools/fetchcontent_smoke.sh

  hooks-backstop:
    name: Hook Backstop Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            --require-hashes \
            --requirement requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          python --version
          pip --version
          clang-format --version

      - name: Repository hook checks
        run: python tools/git_hooks.py ci

      - name: Hook unit tests
        run: >-
          pytest
          tests/test_git_hooks.py
          tests/test_pre_push_ranges.py
          tests/test_ci_reliability.py
          tests/test_ci_changes.py
          tests/test_clang_tidy_changed.py
          tests/test_no_exceptions_manifest.py
          tests/test_paired_bench.py
          tests/test_maintenance_campaign.py
          tests/test_maintenance_evidence_archive.py
          tests/test_check_counter_goldens.py
          tests/test_benchmark_changepoint.py
          tests/test_coverage_gaps.py
          tests/test_workload_matrix.py
          tests/test_packaging_recipes.py
          tests/test_portable_headers.py
          tests/test_benchmark_tools.py
          tests/test_branding_assets.py
          tests/test_publish_docs_root.py
          tests/test_measure_traffic_lab.py
          tests/test_browser_demo_resources.py
          tests/test_compatibility_snapshots.py
          tests/test_check_public_surface.py
          tests/test_check_public_docs.py
          tests/test_check_docs_links.py
          tests/test_cmake_compatibility.py
          tests/test_doc_commands.py
          tests/test_doc_outputs.py
          tests/test_doc_snippets.py
          tests/test_doc_versions.py
          tests/test_tdd_index.py
          tests/test_header_manifest.py
          tests/test_header_compile_cost.py
          tests/test_grid_benchmark_manifest.py
          tests/test_steamdeck_tools.py
          tests/test_thread_scaling_report.py
          tests/test_thread_scaling_chart.py
          tests/test_sweep_cpu_plan.py
          tests/test_budgeted_artifacts.py
          tests/test_compare_budgeted_passes.py
          tests/test_summarize_budgeted_curves.py
          tests/test_changelog_fragments.py
          tests/test_check_mermaid.py
          tests/test_cloud_perf.py
          tests/test_macro_odr_guards.py
          tests/test_msvc_warning_guards.py
          tests/test_parser_fuzz.py
          tests/test_publish_benchmark_data.py

      # Public symbols must be documented in a maintained architecture
      # doc and listed in docs/architecture/surface.json.
      - name: Public surface manifest
        run: python tools/check_public_surface.py

      # Every namespace-scope symbol in an installed API-bearing header must
      # carry a Doxygen comment.
      - name: Public API documentation
        run: python tools/check_public_docs.py

      # Markdown examples are copied from named regions in compiled sources.
      - name: Documentation snippets
        run: python tools/check_doc_snippets.py

      # D13: the snippet checker covers C++ fences only, so a renamed
      # preset or a removed target in a shell fence broke for readers with
      # nothing failing here.
      - name: Documented build commands
        run: python tools/check_doc_commands.py

      # Changelog entries live in per-change fragments so concurrent
      # branches touch disjoint files; a malformed fragment must fail here
      # rather than at release, when it would block the release itself.
      - name: Changelog fragments
        run: python tools/assemble_changelog.py --check

      # Main documents unreleased development APIs while install examples may
      # also pin the latest release. Keep those two versions explicit.
      - name: Documentation versions
        run: python tools/check_doc_versions.py

      - name: Compatibility snapshots
        run: python tools/check_compatibility_snapshots.py

  # The preset list is tier-dependent: pull requests run dev-asan and
  # dev-cppcheck (plus dev-tsan when concurrency-sensitive paths changed);
  # full-tier events run every preset including the full-tree clang-tidy.
  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: Quality Gates (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # 75: a cold clang-tidy sweep after a core header change exceeds 45,
    # and a cancelled job saves no cache, so the low limit deadlocked.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.changes.outputs.quality_presets) }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}--${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}--

      - name: Install cppcheck 2.21.0
        if: matrix.preset == 'dev-cppcheck'
        env:
          CPPCHECK_SHA256: >-
            f028ff75ca5372738f3737c8b3e8611426a6526b6aea2ef01301ab0f5902f044
        run: |
          archive="$RUNNER_TEMP/cppcheck-2.21.0.tar.gz"
          curl -fsSL \
            https://github.com/danmar/cppcheck/archive/refs/tags/2.21.0.tar.gz \
            -o "$archive"
          echo "$CPPCHECK_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cmake \
            -S "$RUNNER_TEMP/cppcheck-2.21.0" \
            -B "$RUNNER_TEMP/cppcheck-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DUSE_MATCHCOMPILER=Off
          cmake --build "$RUNNER_TEMP/cppcheck-build" \
            --target cppcheck --parallel 2
          echo "$RUNNER_TEMP/cppcheck-build/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          if [[ "${{ matrix.preset }}" == dev-clang-tidy ]]; then
            clang-tidy-18 --version
            clang-tidy-18 --version | grep -Eq 'LLVM version 18\.'
          fi
          if command -v cppcheck >/dev/null; then cppcheck --version; fi

      - name: Configure
        run: |
          if [[ "${{ matrix.preset }}" == dev-clang-tidy ]]; then
            cmake --preset dev-clang-tidy \
              -DTESS_CLANG_TIDY_EXE=clang-tidy-18
          else
            cmake --preset "${{ matrix.preset }}"
          fi

      - name: Build
        if: matrix.preset != 'dev-clang-tidy'
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Build clang-tidy with bounded parallelism
        if: matrix.preset == 'dev-clang-tidy'
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 4

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

      - name: Test
        if: >-
          matrix.preset == 'dev-werror' ||
          matrix.preset == 'dev-asan' ||
          matrix.preset == 'dev-tsan' ||
          matrix.preset == 'release'
        run: ctest --preset "${{ matrix.preset }}"

      # Counter-golden drift is shadow-mode and per-tier: each preset
      # that ran ctest surfaces its own report (redesign section 3.3).
      - name: Surface counter-golden drift
        if: ${{ always() }}
        run: |
          report="build/${{ matrix.preset }}/tests/counter-golden-drift.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Blocking diff-scoped clang-tidy for pull requests: changed sources go
  # through the compilation database, changed headers through synthesized
  # translation units. The job's exit status is the signal; the full-tree
  # sweep runs on main in the quality matrix.
  tidy-diff:
    needs: changes
    if: >-
      ${{ github.event_name == 'pull_request' &&
          needs.changes.outputs.code_required == 'true' }}
    name: Diff Clang-Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          clang-tidy-18 --version
          clang-tidy-18 --version | grep -Eq 'LLVM version 18\.'

      - name: Configure
        run: cmake --preset dev

      - name: Diff-scoped clang-tidy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 tools/clang_tidy_changed.py
          "$PR_BASE_SHA" "$HEAD_SHA"
          --build-dir build/dev
          --clang-tidy clang-tidy-18

  # No benchmark gates on macOS: bench/thresholds/*.json ceilings are
  # calibrated against the Linux ubuntu-24.04 runner family and would
  # misfire on Apple Silicon runners. Full tier only: macOS has never
  # failed independently of the Linux jobs (see the 2026-07-28 failure
  # classification), so a regression surfaces one merge later on main.
  macos:
    needs: changes
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.changes.outputs.code_required == 'true' }}
    name: macOS Build And Tests (${{ matrix.preset }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - dev
          - dev-asan
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.preset }}--${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.preset }}--

      - name: Install ccache
        run: brew install ccache

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version
          ccache --version

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"

      # Cross-platform counter-golden drift is exactly what shadow mode
      # exists to observe before any promotion to strict.
      - name: Surface counter-golden drift
        if: ${{ always() }}
        run: |
          report="build/${{ matrix.preset }}/tests/counter-golden-drift.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install smoke
        if: matrix.preset == 'dev'
        run: tools/install_smoke.sh

  # The Visual Studio generator ignores compiler launchers, so the
  # workflow-level ccache env vars are inert here.
  windows:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    # Required gate; the windows-msvc preset treats project warnings as errors.
    name: Windows MSVC
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Show tool versions
        run: cmake --version

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        run: ctest --preset windows-msvc

      # Checked iterators allocate proxy state inside noexcept STL vector
      # constructors, so process-wide allocation rejection is unsafe in Debug.
      # Keep Debug's iterator checks, then exercise failure contracts in the
      # same toolchain's Release configuration.
      - name: Build allocation-failure tests without checked iterators
        run: >-
          cmake --build build/windows-msvc --config Release
          --target tess_allocation_counter_test tess_path_cache_test

      - name: Test allocation-failure contracts without checked iterators
        run: >-
          ctest --test-dir build/windows-msvc -C Release --output-on-failure
          --no-tests=error
          -R "TessAllocationCounter|StrongAllocation|FailedStore"

      # Windows counter-golden drift is the portability evidence the
      # redesign requires before goldens can gate (risk 4).
      - name: Surface counter-golden drift
        if: ${{ always() }}
        shell: bash
        run: |
          report="build/windows-msvc/tests/counter-golden-drift.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install smoke
        shell: bash
        env:
          TESS_INSTALL_SMOKE_BUILD_DIR: >-
            ${{ github.workspace }}/build/windows-msvc
          TESS_INSTALL_SMOKE_CONFIG: Debug
        run: tools/install_smoke.sh

  # Keep focused native MSVC exception-free coverage off the already-long
  # full Windows critical path. The full job leaves the opt-in mode disabled;
  # this job names its required targets explicitly.
  windows-noexceptions:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: Exception-Free (MSVC)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Show tool versions
        run: cmake --version

      - name: Configure validation targets
        run: >-
          cmake --preset windows-msvc
          -DTESS_BUILD_NO_EXCEPTIONS_TESTING=ON

      - name: Build targeted exception-free contracts
        run: >-
          cmake --build build/windows-msvc --config Debug --parallel
          --target tess_no_exceptions_test
          tess_no_exceptions_consumer_contract_test
          tess_no_exceptions_headers_verify_interface_header_sets
          tess_no_exceptions_contract_cells
          tess_block_test
          tess_consumer_contract_test
          tess_maintenance_contract_test
          tess_maintenance_test
          tess_chunk_maintenance_test
          tess_path_cache_test
          tess_phase_executor_test
          tess_sim_auto_exec_test
          tess_sim_schedule_test
          tess_storage_test
          tess_topology_test

      - name: Test exception-free behavior
        run: >-
          ctest --test-dir build/windows-msvc -C Debug
          --output-on-failure --no-tests=error -L config:noexceptions

      - name: Compare exception-mode subsystem manifests
        run: >-
          python tools/check_no_exceptions_manifest.py
          --ctest-dir build/windows-msvc --config Debug

      - name: Exception-free installed consumer
        shell: bash
        env:
          TESS_INSTALL_SMOKE_BUILD_DIR: >-
            ${{ github.workspace }}/build/windows-msvc
          TESS_INSTALL_SMOKE_CONFIG: Debug
          TESS_NO_EXCEPTIONS: 1
        run: tools/install_smoke.sh

      - name: Exception-free FetchContent consumer
        shell: bash
        env:
          TESS_FETCHCONTENT_SMOKE_CONFIG: Debug
          TESS_NO_EXCEPTIONS: 1
        run: tools/fetchcontent_smoke.sh

  # Pull requests compile the bench tree and run the smoke suite (build
  # and API rot, bench_check hooks); threshold gating runs on the full
  # tier, staying authoritative until the redesign's phase 4 shadow-mode
  # criteria retire it. Baseline collection lives in bench-baselines.
  bench:
    needs: changes
    if: ${{ needs.changes.outputs.code_required == 'true' }}
    name: Benchmark Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-bench--${{ github.sha }}
          restore-keys: ccache-bench--

      - name: Show tool versions
        run: |
          cmake --version
          clang++ --version

      - name: Configure
        run: cmake --preset bench

      - name: Build
        run: cmake --build --preset bench

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

      - name: Test
        run: ctest --preset bench

      # The compiled registration union is the authoritative workload
      # universe (section 4.5): the static hooks-tier check covers
      # threshold manifests and lab literals, but only the binaries
      # know what is actually registered — and this survives the
      # phase 4 threshold-manifest retirement.
      #
      # tess_bench_thread_scaling is listed but never executed here: it is
      # a campaign-only worker-count sweep that builds pools far wider
      # than a shared runner has cores. Listing it is what keeps it from
      # rotting, since nothing else in CI runs it.
      #
      # --bench-sources additionally greps bench/*.cc for whole `lab/`
      # name literals, so a name assembled from a macro or a
      # concatenation -- which yields a fragment no family rule can
      # classify -- fails here rather than at analysis time.
      - name: Workload-matrix drift check
        run: |
          ./build/bench/bench/tess_bench --benchmark_list_tests \
            > build/bench/registrations-main.txt
          ./build/bench/bench/tess_bench_diagnostics \
            --benchmark_list_tests \
            > build/bench/registrations-diagnostics.txt
          ./build/bench/bench/tess_bench_thread_scaling \
            --benchmark_list_tests \
            > build/bench/registrations-thread-scaling.txt
          python3 tools/check_workload_matrix.py \
            --catalog bench/workload-matrix.json \
            --registrations build/bench/registrations-main.txt \
            --registrations build/bench/registrations-diagnostics.txt \
            --registrations build/bench/registrations-thread-scaling.txt \
            --bench-sources bench

      # Release-configuration counter-golden drift (shadow mode).
      - name: Surface counter-golden drift
        if: ${{ always() }}
        run: |
          if [ -f build/bench/tests/counter-golden-drift.md ]; then
            cat build/bench/tests/counter-golden-drift.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gated family list lives in bench/CMakeLists.txt, which derives
      # it from the threshold targets it actually defines. Hand-maintaining
      # it here meant a new family could ship a manifest and a target and
      # still never gate, with every test passing. --parallel 1 is
      # load-bearing: these are timing gates and must not run concurrently.
      - name: Benchmark thresholds
        if: github.event_name != 'pull_request'
        run: >-
          cmake --build --preset bench --parallel 1
          --target tess_bench_all_thresholds

  # Non-gating baseline collection, in its own job: the ~27-minute
  # tess_bench_ci_baselines run pushed the gates job past the 45-minute
  # ceiling #109 introduced, cancelling every full main push at the
  # final step — the threshold gates themselves were green each time.
  # The push-only steps never run in pull-request CI, which is how the
  # under-budget ceiling merged unnoticed. Baselines feed change-point
  # and publish-benchmark-history, not the merge decision, so this job
  # is deliberately NOT in ci-gate's needs (waived in ADVISORY_CI_JOBS
  # with the same reasoning as paired-bench); report-failure still
  # observes it so a broken collection files the ci-failure issue.
  bench-baselines:
    needs: changes
    name: Benchmark Baselines
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.code_required == 'true' }}
    runs-on: ubuntu-24.04
    # A pure backstop: the step-level timeouts below (30 + 35 minutes)
    # trip first and conclude as step FAILURES, which report-failure
    # recognizes. A job-ceiling kill concludes as cancelled — the same
    # verdict as a benign concurrency supersede — and would silence the
    # ci-failure issue for exactly the overrun this job was split to
    # contain.
    timeout-minutes: 75
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      # Its own key family so this job and the gates job never race one
      # save slot; the gates family is the warm fallback because both
      # build the same preset.
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-bench-baselines--${{ github.sha }}
          restore-keys: |
            ccache-bench-baselines--
            ccache-bench--

      - name: Configure
        run: cmake --preset bench

      # Observed 13-21 minutes depending on cache warmth.
      - name: Build
        timeout-minutes: 30
        run: cmake --build --preset bench

      - name: Report compiler cache effectiveness
        if: always()
        run: tools/report_ccache_stats.sh

      # Observed ~27 minutes on the last completed collection.
      - name: Collect non-gating benchmark baselines
        timeout-minutes: 35
        run: cmake --build --preset bench --target tess_bench_ci_baselines

      - name: Write benchmark artifact metadata
        run: |
          tools/benchmark_artifact_metadata.py \
            --out build/bench/bench/ci-baselines/metadata.json \
            --build-dir build/bench

      - name: Upload benchmark baseline artifact
        # upload-artifact v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-baselines-${{ github.run_id }}
          path: build/bench/bench/ci-baselines/*.json
          retention-days: 30

  # Shadow-mode paired sentinel run (redesign section 4.1): base and
  # head bench-only binaries interleave the sentinel set on one runner
  # and the verdict lands in the step summary and an artifact. Shadow
  # mode never gates — this job is deliberately NOT in ci-gate's needs,
  # so neither a regression verdict nor an infrastructure failure can
  # block a merge while the calibrated threshold gates remain
  # authoritative (section 4.3). The base build uses explicit flags
  # because the base commit may predate the bench-only preset.
  paired-bench:
    needs: changes
    if: >-
      ${{ github.event_name == 'pull_request' &&
          needs.changes.outputs.code_required == 'true' &&
          needs.changes.outputs.perf_required == 'true' }}
    name: Paired Sentinel Benchmarks (shadow)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      # Normalize absolute paths so the base worktree build hits the
      # same cache entries as the head build.
      CCACHE_BASEDIR: ${{ github.workspace }}/..
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install ccache
        run: tools/install_ci_ccache.sh

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-paired--${{ github.sha }}
          restore-keys: |
            ccache-paired--
            ccache-bench--

      - name: Build head sentinel binary
        run: |
          cmake --preset bench-only
          cmake --build --preset bench-only
          ccache -s

      # Explicit flags rather than the preset: the base commit may
      # predate bench-only. The worktree lives beside the workspace so
      # CCACHE_BASEDIR covers both checkouts.
      - name: Build base sentinel binary
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(dirname "$GITHUB_WORKSPACE")/paired-base"
          git worktree add "$base_dir" "$PR_BASE_SHA"
          # The build directory mirrors the head's build/bench-only depth
          # so ccache's base_dir path rewriting yields identical keys.
          cmake -S "$base_dir" -B "$base_dir/build/bench-only" \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESS_BUILD_TESTING=OFF \
            -DTESS_BUILD_EXAMPLES=OFF \
            -DTESS_BUILD_BENCHMARKS=ON \
            -DTESS_ENABLE_WARNINGS=ON \
            -DTESS_ENABLE_ENTT=ON \
            -DTESS_ENABLE_FLECS=ON \
            -DTESS_WARNINGS_AS_ERRORS=ON
          cmake --build "$base_dir/build/bench-only" --target tess_bench
          ccache -s

      - name: Paired sentinel run (shadow)
        run: |
          status=0
          python3 tools/paired_bench.py \
            --base-binary \
              "$(dirname "$GITHUB_WORKSPACE")/paired-base/build/bench-only/bench/tess_bench" \
            --head-binary build/bench-only/bench/tess_bench \
            --sentinels bench/sentinels.json \
            --mode shadow \
            --summary paired-summary.md \
            --json paired-report.json || status=$?
          [ -f paired-summary.md ] && \
            cat paired-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload paired report
        # upload-artifact v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-bench-${{ github.run_id }}
          path: |
            paired-report.json
            paired-summary.md
          retention-days: 90

  # Stable ruleset target for the required jobs in this workflow.
  # Documentation remains an independent required workflow.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - changes
      - dev
      - gcc
      - libcxx
      - no-exceptions
      - hooks-backstop
      - quality
      - tidy-diff
      - macos
      - windows
      - windows-noexceptions
      - bench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful CI jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.hooks-backstop.result }}" = success
          code="${{ needs.changes.outputs.code_required }}"
          test "$code" = true || test "$code" = false
          if [ "$code" = true ]; then
            test "${{ needs.dev.result }}" = success
            test "${{ needs.gcc.result }}" = success
            test "${{ needs.libcxx.result }}" = success
            test "${{ needs.no-exceptions.result }}" = success
            test "${{ needs.quality.result }}" = success
            test "${{ needs.windows.result }}" = success
            test "${{ needs.windows-noexceptions.result }}" = success
            test "${{ needs.bench.result }}" = success
            if [ "$EVENT_NAME" = pull_request ]; then
              test "${{ needs.tidy-diff.result }}" = success
              test "${{ needs.macos.result }}" = skipped
            else
              test "${{ needs.tidy-diff.result }}" = skipped
              test "${{ needs.macos.result }}" = success
            fi
          else
            test "${{ needs.dev.result }}" = skipped
            test "${{ needs.gcc.result }}" = skipped
            test "${{ needs.libcxx.result }}" = skipped
            test "${{ needs.no-exceptions.result }}" = skipped
            test "${{ needs.quality.result }}" = skipped
            test "${{ needs.tidy-diff.result }}" = skipped
            test "${{ needs.macos.result }}" = skipped
            test "${{ needs.windows.result }}" = skipped
            test "${{ needs.windows-noexceptions.result }}" = skipped
            test "${{ needs.bench.result }}" = skipped
          fi

  release-linux-floors:
    name: Linux Floor (${{ matrix.name }}, no RTTI)
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code_required == 'true' &&
          github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 12
            cc: gcc-12
            cxx: g++-12
          - name: Clang 16
            cc: clang-16
            cxx: clang++-16
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify compiler floor
        run: |
          ninja --version | grep -Eq '^1\.'
          "$CXX" --version
          if [ "$CXX" = g++-12 ]; then
            test "$("$CXX" -dumpversion | cut -d. -f1)" = 12
          else
            "$CXX" --version | grep -Eq 'clang version 16\.'
          fi

      - name: Configure without RTTI
        run: >-
          cmake -S . -B build/release-linux-floor -GNinja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-fno-rtti
          -DTESS_BUILD_TESTING=ON
          -DTESS_BUILD_EXAMPLES=ON
          -DTESS_ENABLE_ENTT=ON
          -DTESS_ENABLE_FLECS=ON
          -DTESS_ENABLE_WARNINGS=ON
          -DTESS_WARNINGS_AS_ERRORS=ON

      - name: Build and run full floor suite
        run: |
          cmake --build build/release-linux-floor --parallel
          ctest --test-dir build/release-linux-floor --output-on-failure
          build/release-linux-floor/examples/tess_quickstart

  release-macos-floor:
    name: Xcode 16.0 Floor (no RTTI)
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code_required == 'true' &&
          github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
      CC: clang
      CXX: clang++
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select and verify Xcode floor
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.0.app
          xcodebuild -version | grep -Fx 'Xcode 16.0'
          clang++ --version | grep -Eq 'Apple clang version 16\.0'

      - name: Configure without RTTI
        run: >-
          cmake -S . -B build/release-macos-floor
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-fno-rtti
          -DTESS_BUILD_TESTING=ON
          -DTESS_BUILD_EXAMPLES=ON
          -DTESS_ENABLE_WARNINGS=ON
          -DTESS_WARNINGS_AS_ERRORS=ON

      - name: Build and run full floor suite
        run: |
          # macos-15 is a three-core, 7 GB hosted runner. An unbounded native
          # build launches every translation unit and exhausts the job budget.
          cmake --build build/release-macos-floor --parallel 3
          ctest --test-dir build/release-macos-floor --output-on-failure
          build/release-macos-floor/examples/tess_quickstart

  release-windows-floor:
    name: MSVC 19.44 Floor (no RTTI)
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code_required == 'true' &&
          github.event_name != 'pull_request' }}
    # windows-2025 moved to Visual Studio 2026 in June 2026. GitHub directs
    # Visual Studio 2022 users to windows-2022, which carries the 17.14/MSVC
    # 19.44 floor verified below.
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure without RTTI
        run: cmake --preset windows-msvc -DCMAKE_CXX_FLAGS=/GR-

      - name: Verify compiler floor
        shell: pwsh
        run: |
          $file = Get-ChildItem build/windows-msvc/CMakeFiles -Recurse `
            -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          if ($null -eq $file) {
            throw 'CMake C++ compiler metadata was not generated'
          }
          $versionMatches = Select-String -Path $file.FullName -Quiet `
            -Pattern 'CMAKE_CXX_COMPILER_VERSION "19\.44\.'
          if (-not $versionMatches) {
            throw 'Expected the MSVC 19.44 compiler floor'
          }

      - name: Build and run full floor suite
        run: |
          cmake --build --preset windows-msvc
          ctest --preset windows-msvc

  release-cmake-floor:
    name: CMake 3.25.3 Consumer Floor
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code_required == 'true' &&
          github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned CMake floor
        run: |
          url="$(jq -r .cmake.linux_x86_64 ci/tools.lock.json)"
          expected="$(jq -r .cmake.sha256 ci/tools.lock.json)"
          archive="$RUNNER_TEMP/cmake-floor.tar.gz"
          install_dir="$RUNNER_TEMP/cmake-floor"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "$expected  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" \
            --directory "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Configure, install, discover, build, and run
        env:
          TESS_INSTALL_SMOKE_BUILD_DIR: >-
            ${{ github.workspace }}/build/cmake-floor
        run: |
          test "$(cmake --version | head -1)" = 'cmake version 3.25.3'
          cmake -S . -B build/cmake-floor \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESS_BUILD_TESTING=OFF \
            -DTESS_BUILD_EXAMPLES=OFF
          tools/install_smoke.sh

  release-fuzz:
    name: Archive Fuzzing
    needs: changes
    if: >-
      ${{ needs.changes.outputs.release_mode == 'true' ||
          github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
      CC: clang-16
      CXX: clang++-16
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build ASan UBSan libFuzzer target
        run: |
          clang++-16 --version | grep -Eq 'clang version 16\.'
          cmake -S . -B build/fuzz -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTESS_BUILD_TESTING=OFF \
            -DTESS_BUILD_EXAMPLES=OFF \
            -DTESS_BUILD_FUZZING=ON
          cmake --build build/fuzz --target tess_world_archive_fuzzer

      - name: Run archive campaign
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          seconds=60
          case "$EXPECTED_VERSION" in
            *-rc.*) seconds=3600 ;;
          esac
          build/fuzz/tess_world_archive_fuzzer \
            tests/fuzz/corpus/world_archive \
            -max_len=1048576 -max_total_time="$seconds"

  release-packages:
    name: Release Package Consumers
    needs: changes
    if: ${{ needs.changes.outputs.release_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: d015e31e90838a4c9dfa3eed45979bc70d9357fc
          path: build/vcpkg
          persist-credentials: false

      - name: Install overlay and run vcpkg consumer
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          build/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          build/vcpkg/vcpkg install tess \
            --overlay-ports="$GITHUB_WORKSPACE/ports" \
            --x-install-root="$GITHUB_WORKSPACE/build/vcpkg-installed" \
            --binarysource=clear
          numeric_version="${EXPECTED_VERSION%%-*}"
          prerelease=""
          if [ "$numeric_version" != "$EXPECTED_VERSION" ]; then
            prerelease="${EXPECTED_VERSION#*-}"
          fi
          cmake -S tests/install_consumer -B build/vcpkg-consumer \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/vcpkg-installed/x64-linux" \
            -DTESS_EXPECTED_VERSION="$numeric_version" \
            -DTESS_EXPECTED_PRERELEASE="$prerelease"
          cmake --build build/vcpkg-consumer
          build/vcpkg-consumer/tess_install_consumer

      - name: Install pinned Conan
        run: |
          url="$(jq -r .conan.wheel ci/tools.lock.json)"
          expected="$(jq -r .conan.sha256 ci/tools.lock.json)"
          wheel="$RUNNER_TEMP/conan-2.31.1-py3-none-any.whl"
          curl --fail --location --retry 3 --output "$wheel" "$url"
          echo "$expected  $wheel" | sha256sum --check --strict
          python3 -m pip install "$wheel"
          test "$(conan --version)" = 'Conan version 2.31.1'

      - name: Create Conan package and run consumer
        run: |
          conan profile detect --force
          conan create . --build=missing -s compiler.cppstd=20

  release-portable-headers:
    name: Release Portable Headers
    needs: changes
    if: ${{ needs.changes.outputs.release_mode == 'true' }}
    uses: ./.github/workflows/portable-headers-release.yml
    with:
      expected_version: ${{ inputs.expected_version }}
      tested_sha: ${{ needs.changes.outputs.tested_sha }}

  release-compatibility:
    name: Release Compatibility Snapshots
    needs: changes
    if: ${{ needs.changes.outputs.release_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate compatibility snapshots
        run: |
          python3 tools/check_compatibility_snapshots.py
          cmake -S . -B build/compatibility \
            -DTESS_BUILD_TESTING=OFF \
            -DTESS_BUILD_EXAMPLES=OFF
          install_prefix="$PWD/build/compatibility/install"
          cmake --install build/compatibility --prefix "$install_prefix"
          for manifest in compatibility/*/manifest.json; do
            [ -f "$manifest" ] || continue
            snapshot="$(dirname "$manifest")"
            version="$(basename "$snapshot")"
            consumer_project="$(jq -r .consumer_project "$manifest")"
            consumer_target="$(jq -r .consumer_target "$manifest")"
            archive_consumer_target="$(
              jq -r .archive_consumer_target "$manifest"
            )"
            cmake -S "$snapshot/$consumer_project" \
              -B "build/compatibility/$version-consumer" \
              -DCMAKE_PREFIX_PATH="$install_prefix" \
              -DTESS_SNAPSHOT_DIR="$PWD/$snapshot"
            cmake --build "build/compatibility/$version-consumer" \
              --target "$consumer_target" "$archive_consumer_target"
            ctest --test-dir "build/compatibility/$version-consumer" \
              --output-on-failure --no-tests=error \
              -R "^$consumer_target$"
            ctest --test-dir "build/compatibility/$version-consumer" \
              --output-on-failure --no-tests=error \
              -R "^$archive_consumer_target$"
          done

  release-docs:
    name: Release Documentation
    needs: changes
    if: ${{ needs.changes.outputs.release_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ""
      DOXYGEN_VERSION: 1.17.0
      DOXYGEN_SHA256: >-
        75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install documentation tools
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install \
            --require-hashes --requirement requirements-docs.txt
          archive="$RUNNER_TEMP/doxygen.tar.gz"
          install_dir="$RUNNER_TEMP/doxygen"
          release="Release_${DOXYGEN_VERSION//./_}"
          asset="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/doxygen/doxygen/releases/download/$release/$asset"
          echo "$DOXYGEN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" \
            --directory "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Build maintained and API documentation
        run: |
          python3 tools/fetch_mermaid.py
          python3 tools/check_doc_snippets.py
          python3 tools/check_doc_versions.py
          .venv-docs/bin/mkdocs build --strict
          cmake -S . -B build/release-docs \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESS_BUILD_TESTING=OFF \
            -DTESS_BUILD_EXAMPLES=OFF \
            -DTESS_BUILD_DOCS=ON
          cmake --build build/release-docs --target tess_docs

  release-evidence:
    name: Release Evidence
    if: ${{ always() && needs.changes.outputs.release_mode == 'true' }}
    needs:
      - changes
      - dev
      - gcc
      - libcxx
      - no-exceptions
      - hooks-backstop
      - quality
      - macos
      - windows
      - windows-noexceptions
      - bench
      - scheduled-sweeps
      - ci-gate
      - release-linux-floors
      - release-macos-floor
      - release-windows-floor
      - release-cmake-floor
      - release-fuzz
      - release-packages
      - release-portable-headers
      - release-compatibility
      - release-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Fragment-syntax validity is checked on every run; it says
      # nothing about whether the release records were assembled. RC1's
      # first release-mode run reported success with 24 valid fragments
      # pending beside an already-dated release heading.
      - name: Require assembled release records
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 tools/assemble_changelog.py \
            --require-released "$EXPECTED_VERSION"

      - name: Require every release gate
        env:
          DEV: ${{ needs.dev.result }}
          GCC: ${{ needs.gcc.result }}
          LIBCXX: ${{ needs.libcxx.result }}
          NO_EXCEPTIONS: ${{ needs.no-exceptions.result }}
          HOOKS: ${{ needs.hooks-backstop.result }}
          QUALITY: ${{ needs.quality.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          WINDOWS_NO_EXCEPTIONS: ${{ needs.windows-noexceptions.result }}
          BENCH: ${{ needs.bench.result }}
          SCHEDULED_SWEEPS: ${{ needs.scheduled-sweeps.result }}
          CI_GATE: ${{ needs.ci-gate.result }}
          LINUX_FLOORS: ${{ needs.release-linux-floors.result }}
          MACOS_FLOOR: ${{ needs.release-macos-floor.result }}
          WINDOWS_FLOOR: ${{ needs.release-windows-floor.result }}
          CMAKE_FLOOR: ${{ needs.release-cmake-floor.result }}
          FUZZ: ${{ needs.release-fuzz.result }}
          PACKAGES: ${{ needs.release-packages.result }}
          PORTABLE_HEADERS: ${{ needs.release-portable-headers.result }}
          COMPATIBILITY: ${{ needs.release-compatibility.result }}
          DOCS: ${{ needs.release-docs.result }}
        run: |
          for result in "$DEV" "$GCC" "$LIBCXX" "$NO_EXCEPTIONS" \
              "$HOOKS" "$QUALITY" "$MACOS" "$WINDOWS" \
              "$WINDOWS_NO_EXCEPTIONS" "$BENCH" \
              "$SCHEDULED_SWEEPS" "$CI_GATE" "$LINUX_FLOORS" "$MACOS_FLOOR" \
              "$WINDOWS_FLOOR" "$CMAKE_FLOOR" "$FUZZ" "$PACKAGES" \
              "$PORTABLE_HEADERS" "$COMPATIBILITY" "$DOCS"; do
            test "$result" = success
          done

      - name: Capture completed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-job-logs
          jobs_url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          gh api --paginate --slurp "$jobs_url?per_page=100" \
            > release-jobs-pages.json
          python3 - <<'PY' > release-completed-jobs.txt
          import json
          from pathlib import Path

          pages = json.loads(
              Path("release-jobs-pages.json").read_text(encoding="utf-8")
          )
          for page in pages:
            for job in page["jobs"]:
              if (
                  job["status"] == "completed"
                  and job["conclusion"] == "success"
              ):
                print(job["id"])
          PY
          while IFS= read -r job_id; do
            gh api --allow-escape-sequences \
              "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
              > "release-job-logs/$job_id.log"
          done < release-completed-jobs.txt

      - name: Write release evidence
        env:
          TESTED_SHA: ${{ needs.changes.outputs.tested_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifests = sorted(
              str(path) for path in Path("compatibility").glob("*/manifest.json")
          )
          pages = json.loads(
              Path("release-jobs-pages.json").read_text(encoding="utf-8")
          )
          jobs = {
              str(job["id"]): job
              for page in pages
              for job in page["jobs"]
          }
          observed_logs = {}
          for path in sorted(Path("release-job-logs").glob("*.log")):
            job_id = path.stem
            observed_logs[job_id] = {
                "job": jobs[job_id]["name"],
                "path": str(path),
                "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
            }
          payload = {
              "tested_sha": os.environ["TESTED_SHA"],
              "expected_version": os.environ["EXPECTED_VERSION"],
              "tool_version_evidence": {
                  "bundled_job_logs": observed_logs,
                  "workflow_run_url": os.environ["WORKFLOW_RUN_URL"],
                  "expected_and_pinned": {
                      "cmake_floor": "3.25.3",
                      "conan": "2.31.1",
                      "gcc_floor": "12",
                      "clang_floor": "16",
                      "xcode_floor": "16.0",
                      "msvc_floor": "19.44",
                      "clang_tidy": "18",
                      "vcpkg_commit": (
                          "d015e31e90838a4c9dfa3eed45979bc70d9357fc"
                      ),
                  },
              },
              "compatibility_snapshots": manifests,
              "gates": {
                  name: value["result"]
                  for name, value in json.loads(os.environ["NEEDS_JSON"]).items()
              },
          }
          Path("release-evidence.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence-${{ needs.changes.outputs.tested_sha }}
          path: |
            release-evidence.json
            release-job-logs/
            release-jobs-pages.json
            compatibility/
          retention-days: 90

  # Change-point alerting (redesign section 4.2): a dedicated job so
  # the bench job, which executes pull-request code, never holds write
  # permissions. Runs only on pushes to main (the artifact series is
  # once-per-main-push by construction), downloads the trailing
  # baseline artifacts, and files or extends one rolling
  # perf-change-point issue when a sustained shift is suspected.
  # Alerting is advisory: this job's failure is an infrastructure
  # problem, not a performance verdict, and it gates nothing.
  change-point:
    name: Benchmark Change Point
    needs: bench-baselines
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
    concurrency:
      group: perf-change-point
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download trailing baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trailing
          gh api \
            'repos/${{ github.repository }}/actions/artifacts?per_page=100' \
            --paginate \
            --jq '.artifacts[]
                  | select(.name | startswith("benchmark-baselines-"))
                  | select(.expired == false)
                  | select(.workflow_run.head_branch == "main")
                  | select(.workflow_run.repository_id
                           == .workflow_run.head_repository_id)
                  | "\(.id) \(.workflow_run.id)"' \
            | head -60 \
            | while read -r artifact_id run_id; do
                dir="trailing/$run_id"
                [ -d "$dir" ] && continue
                mkdir -p "$dir"
                gh api \
                  "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" \
                  > "$dir/a.zip" || { rm -rf "$dir"; continue; }
                unzip -qo "$dir/a.zip" -d "$dir" && rm "$dir/a.zip"
              done
          find trailing -mindepth 1 -maxdepth 1 -type d | wc -l

      - name: Detect change points
        run: |
          python3 tools/benchmark_changepoint.py \
            --artifacts trailing \
            --report change-point.md \
            --json change-point.json
          cat change-point.md >> "$GITHUB_STEP_SUMMARY"

      - name: File or update the perf-change-point issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(python3 -c \
            "import json; print(json.load(open('change-point.json'))['verdict'])")
          case "$verdict" in
            suspects)
              ;;
            partial)
              echo "::warning::change-point verdict is partial; see summary"
              exit 0
              ;;
            clean|insufficient-history|no-data|series-break|newest-unusable)
              echo "verdict: $verdict — no issue action"
              exit 0
              ;;
            *)
              echo "::error::unknown change-point verdict: ${verdict:-<empty>}"
              exit 1
              ;;
          esac
          marker="<!-- perf-change-point:${GITHUB_RUN_ID} -->"
          printf '%s\n\n' "$marker" > issue-body.md
          cat change-point.md >> issue-body.md
          gh label create perf-change-point \
            --repo "$GITHUB_REPOSITORY" \
            --description "Automated sustained benchmark shift suspicion" \
            --color D93F0B --force
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label perf-change-point --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            if gh issue view "$existing" --repo "$GITHUB_REPOSITORY" \
                --json body,comments \
                --jq '.body, .comments[].body' \
                | grep -qF "$marker"; then
              echo "already reported by this run"
            else
              gh issue comment "$existing" \
                --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
            fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --label perf-change-point \
              --title "Sustained benchmark shift suspected" \
              --body-file issue-body.md
          fi

  # Long-retention benchmark history (redesign sections 7 and 12), main
  # pushes only. GitHub expires run artifacts after 30 days, so a
  # bisection weeks later has nothing to read; section 12 settles the
  # store as an ORPHAN data branch, which survives retention policy
  # without adding an external dependency. The branch carries no working
  # tree, so a normal clone does not pay for it.
  #
  # Never gating: a publish failure must not fail a merged commit, but it
  # must be VISIBLE, so the job is in report-failure's needs rather than
  # in ci-gate's. An empty or metadata-only publish is an error in the
  # tool -- a step that writes nothing and reports success is
  # indistinguishable from a healthy run until the history is needed and
  # missing.
  #
  # KNOWN GAP: the workflow-level concurrency group cancels a superseded
  # main run, and this job waits on bench-baselines, so a commit merged while an
  # earlier run is still building publishes nothing. The history is
  # therefore per-completed-main-RUN, not per-commit, and rapid merges
  # leave holes. Acceptable for bisection, which reads the nearest
  # neighbours rather than requiring every commit; closing it would need
  # a separate non-cancelling workflow. Do not describe this history as
  # covering every main commit.
  publish-benchmark-history:
    name: Publish Benchmark History
    needs: bench-baselines
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.bench-baselines.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Not persisted, matching every other checkout here: a token in
          # .git/config is readable by anything the job later runs. The
          # push below authenticates for that one command instead.
          persist-credentials: false

      - name: Download baselines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-baselines-${{ github.run_id }}
          path: baselines

      - name: Publish to the data branch
        env:
          DATA_BRANCH: benchmark-data
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Every remote command carries the token, reads included. The
          # repository is public today, so anonymous reads would work --
          # but if it ever goes private, an unauthenticated ls-remote
          # fails, this branch is mistaken for absent, and each run then
          # recreates it and is rejected. History would stop after one
          # publication with no error that names the cause.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' \
            "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git config --local "http.extraheader" "$auth"

          # Orphan branch, created on first run.
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" \
              >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$DATA_BRANCH"
            git worktree add ../data-branch "origin/$DATA_BRANCH" --detach
            git -C ../data-branch switch -c "$DATA_BRANCH"
          else
            git worktree add --detach ../data-branch
            git -C ../data-branch checkout --orphan "$DATA_BRANCH"
            git -C ../data-branch rm -rf --quiet . || true
          fi

          python3 tools/publish_benchmark_data.py \
            --out-dir ../data-branch \
            --commit "$HEAD_SHA" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --run-id "$RUN_ID" \
            baselines/*.json

          cd ../data-branch
          git add -A
          # Nothing staged means the tool wrote nothing new. Benign on a
          # re-run of an unchanged commit, so report and stop rather than
          # failing a merged commit.
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "Publish baselines for ${HEAD_SHA:0:12}"
          # Concurrent main merges race for this branch; rebase and retry
          # rather than force-pushing over another run's history.
          # The worktree has its own config; carry the same header there.
          git config --local "http.extraheader" "$auth"
          for attempt in 1 2 3; do
            if git push origin "$DATA_BRANCH"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing"
            git fetch --no-tags origin "$DATA_BRANCH"
            git rebase "origin/$DATA_BRANCH" || exit 1
          done
          echo "error: could not publish after 3 attempts" >&2
          exit 1

  # Long-seed property sweeps and advisory coverage live in
  # scheduled-sweeps.yml; see that file for why they are called rather
  # than moved. This job's result stands in for both.
  scheduled-sweeps:
    name: Scheduled Sweeps
    if: >-
      ${{ github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/scheduled-sweeps.yml

  # Reports non-PR failures serially without running repository code.
  report-failure:
    name: Report CI Failure
    concurrency:
      group: ci-failure-report
      queue: max
    if: >-
      ${{ always() && github.event_name != 'pull_request' &&
          (contains(needs.*.result, 'failure') ||
           github.run_attempt > 1) }}
    needs:
      - changes
      - dev
      - gcc
      - libcxx
      - no-exceptions
      - hooks-backstop
      - quality
      - tidy-diff
      - macos
      - windows
      - windows-noexceptions
      - bench
      - bench-baselines
      - ci-gate
      - release-linux-floors
      - release-macos-floor
      - release-windows-floor
      - release-cmake-floor
      - release-fuzz
      - release-packages
      - release-portable-headers
      - release-compatibility
      - release-docs
      - release-evidence
      - change-point
      - publish-benchmark-history
      - scheduled-sweeps
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: File or update the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          has_unresolved=$(printf '%s' "$JOB_RESULTS" | jq -r \
            'any(.[]; .result == "failure" or .result == "cancelled")')
          if [ "$has_unresolved" = false ]; then
            if [ "$SOURCE_RUN_ATTEMPT" -le 1 ]; then
              exit 0
            fi
          # CI_RECOVERY_BLOCK_BEGIN
          cat > "$RUNNER_TEMP/ci-recovery-classifier.py" <<'PY'
          # CI_RECOVERY_CLASSIFIER_BEGIN
          import json, os, re, sys
          data = json.load(sys.stdin)
          issue = data.get("issue", {})
          timeline = data.get("timeline", [])
          current_attempt = int(os.environ["SOURCE_RUN_ATTEMPT"])
          latest = timeline[-1] if isinstance(timeline, list) and timeline else {}
          markers = re.findall(
            r"^<!-- tess-ci-report run_id=(\d+) attempt=(\d+) -->$",
            latest.get("body", ""), flags=re.M,
          )
          run_id, attempt = map(int, markers[0]) if len(markers) == 1 else (0, 0)
          created, updated = latest.get("created_at"), latest.get("updated_at")
          owned = (
            current_attempt > 1 and issue.get("state") == "OPEN"
            and latest.get("event") == "commented"
            and latest.get("user", {}).get("login") == "github-actions[bot]"
            and created is not None and created == updated
            and issue.get("updatedAt") == updated
            and run_id == int(os.environ["SOURCE_RUN_ID"])
            and 0 < attempt < current_attempt
          )
          print(issue.get("number", "") if owned else "")
          # CI_RECOVERY_CLASSIFIER_END
          PY
          read_owned_issue() {
            issues=$(gh issue list --repo "$GITHUB_REPOSITORY" \
              --label ci-failure --state open --limit 101 \
              --json number,state,updatedAt) || return 1
            issue_count=$(printf '%s' "$issues" | jq 'length') || return 1
            [ "$issue_count" -eq 1 ] || return 0
            number=$(printf '%s' "$issues" | jq -r '.[0].number') || \
              return 1
            issue=$(printf '%s' "$issues" | jq '.[0]') || return 1
            pages=$(gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/issues/$number/timeline?per_page=100") \
              || return 1
            payload=$(printf '%s\n%s\n' "$issue" "$pages" | jq -s \
              '{issue: .[0], timeline: (.[1] | add)}') || return 1
            printf '%s' "$payload" | \
              python3 "$RUNNER_TEMP/ci-recovery-classifier.py"
          }
          owned_issue=$(read_owned_issue) || exit 0
          [ -n "$owned_issue" ] || exit 0
          # Final read narrows the race before close; a human can still reopen.
          final_issue=$(read_owned_issue) || exit 0
          [ "$final_issue" = "$owned_issue" ] || exit 0
          gh issue close "$owned_issue" --repo "$GITHUB_REPOSITORY" \
            --reason completed \
            --comment "Recovered in attempt $SOURCE_RUN_ATTEMPT: \
          $SOURCE_RUN_URL"
          # CI_RECOVERY_BLOCK_END
            exit 0
          fi

          gh label create ci-failure \
            --repo "$GITHUB_REPOSITORY" \
            --description "Automated report of a non-PR CI failure" \
            --color B60205 --force
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$run_url/actions/runs/$GITHUB_RUN_ID"
          failed=$(printf '%s' "$JOB_RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          failed = sorted(
            job for job, state in needs.items()
            if state["result"] == "failure"
          )
          gate_jobs = (
            "changes",
            "dev",
            "gcc",
            "libcxx",
            "no-exceptions",
            "hooks-backstop",
            "quality",
            "tidy-diff",
            "macos",
            "windows",
            "windows-noexceptions",
            "bench",
          )
          gate_cancelled = any(
            needs.get(job, {}).get("result") == "cancelled"
            for job in gate_jobs
          )
          if failed == ["ci-gate"] and gate_cancelled:
            failed = []
          print(", ".join(failed))
          ')
          if [ -z "$failed" ]; then
            superseded=false
            if [ "$GITHUB_EVENT_NAME" = push ] &&
                runs=$(gh api --method GET \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch="$GITHUB_REF_NAME" \
                -f event="$GITHUB_EVENT_NAME" \
                -F per_page=100) &&
                superseded=$(printf '%s' "$runs" | \
                  CURRENT_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
                  GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
                  GITHUB_REF_NAME="$GITHUB_REF_NAME" \
                  python3 -c '
          # CI_SUPERSESSION_CLASSIFIER_BEGIN
          import json, os, sys
          runs = json.load(sys.stdin)
          current = int(os.environ["CURRENT_RUN_NUMBER"])
          branch = os.environ["GITHUB_REF_NAME"]
          event = os.environ["GITHUB_EVENT_NAME"]
          newer = event == "push" and any(
            int(run["run_number"]) > current
            and run.get("head_branch") == branch
            and run.get("event") == event
            for run in runs["workflow_runs"]
          )
          print("true" if newer else "false")
          # CI_SUPERSESSION_CLASSIFIER_END
          '); then
              :
            else
              echo "::warning::Unable to confirm CI run supersession"
              superseded=false
            fi
            if [ "$superseded" = true ]; then
              echo "Newer equivalent CI run superseded this run"
              exit 0
            fi
            failed=ci-gate
          fi
          title="CI failing on ${GITHUB_REF_NAME}"
          cancelled=$(printf '%s' "$JOB_RESULTS" | jq -r '
            . as $needs |
            ["changes", "dev", "gcc", "libcxx", "no-exceptions",
             "hooks-backstop", "quality", "tidy-diff", "macos", "windows",
             "windows-noexceptions", "bench"] |
            map(select($needs[.].result == "cancelled")) | join(", ")')
          marker="<!-- tess-ci-report run_id=${GITHUB_RUN_ID} \
          attempt=${GITHUB_RUN_ATTEMPT} -->"
          body="$marker
          CI ${GITHUB_EVENT_NAME} run attempt ${GITHUB_RUN_ATTEMPT} failed: \
          ${run_url}
          Failed jobs: ${failed}
          Cancelled required jobs: ${cancelled:-none}
          ci-gate is a derivative aggregate; inspect the jobs above."
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label ci-failure --state open --limit 101 --json number)
          issue_count=$(printf '%s' "$issues" | jq 'length')
          [ "$issue_count" -le 1 ] || exit 1
          if [ "$issue_count" -eq 0 ]; then
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --label ci-failure --title "$title" \
              --body "Automated CI reports are posted as comments.")
            existing=${issue_url##*/}
          else
            existing=$(printf '%s' "$issues" | jq -r '.[0].number')
          fi
          gh issue comment "$existing" \
            --repo "$GITHUB_REPOSITORY" --body "$body"
