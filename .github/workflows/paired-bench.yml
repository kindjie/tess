name: Paired sentinel confirmation

# Maintainer-triggered confirmation mode of the paired SENTINEL run:
# confirms or refutes a suspected regression between two explicit
# revisions under Bonferroni-adjusted statistical criteria, failing on
# a confirmed regression. The scope is the sentinel set by default, or
# a predeclared suspect list (for example the change-point issue's
# benchmarks) via the suspects input — formal confirmation is
# deliberately suspect-scoped, because extreme-tail bootstrap intervals
# over hundreds of benchmarks are not statistically valid at practical
# round counts (the plan's section 4.2 records this resolution). Runs
# only on hosted runners against repository history — never untrusted
# code.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit SHA (full)
        required: true
      head:
        description: Head commit SHA (full)
        required: true
      suspects:
        description: >-
          Optional comma-separated benchmark names to confirm instead of
          the sentinel set (max 64; statistics size to this list; a name
          unavailable in either revision fails the run; diagnostics-only
          registrations cannot be confirmed here — they live outside the
          tess_bench binary)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: paired-bench-confirm
  cancel-in-progress: false

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}/..

jobs:
  confirm:
    name: Paired Sentinel Confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install ccache
        run: (sudo apt-get update || true) && sudo apt-get install -y ccache

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-paired-confirm-${{ github.run_id }}
          restore-keys: |
            ccache-paired-
            ccache-bench-

      # Both sides build with explicit flags so any historical commit
      # works, preset or no preset.
      - name: Build both sentinel binaries
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          for side in base head; do
            if [ "$side" = base ]; then sha="$BASE_SHA"; else sha="$HEAD_SHA"; fi
            echo "$sha" | grep -qE '^[0-9a-f]{40}$' || {
              echo "error: $side must be a full lowercase commit SHA" >&2
              exit 1
            }
            side_dir="$(dirname "$GITHUB_WORKSPACE")/paired-$side"
            # A squash-merged pull request's head commit is not
            # reachable from main, so a plain clone cannot see it — and
            # those are exactly the commits a confirmation replays.
            # Fetch the object explicitly when it is missing.
            #
            # The fetch is anonymous on purpose. This job builds and
            # runs benchmark code from whatever historical commits were
            # requested, so the checkout deliberately does not persist
            # credentials: a token in the local Git config would be
            # readable by that code. Anonymous fetch is sufficient while
            # the repository is public; if it is ever made private this
            # path needs an explicitly scoped credential rather than a
            # persisted one.
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$sha" || {
                echo "error: cannot fetch $sha from origin. Either the" \
                  "commit was garbage collected, or the repository is" \
                  "private and this anonymous fetch has no credentials" >&2
                exit 1
              }
            fi
            git worktree add "$side_dir" "$sha"
            cmake -S "$side_dir" -B "$side_dir/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DTESS_BUILD_TESTING=OFF \
              -DTESS_BUILD_EXAMPLES=OFF \
              -DTESS_BUILD_BENCHMARKS=ON \
              -DTESS_ENABLE_WARNINGS=ON \
              -DTESS_ENABLE_ENTT=ON \
              -DTESS_ENABLE_FLECS=ON \
              -DTESS_WARNINGS_AS_ERRORS=ON
            cmake --build "$side_dir/build" --target tess_bench
            ccache -s
          done

      # Capture the exit status so a confirmed regression still lands
      # its summary before failing the step.
      - name: Paired sentinel run (confirm)
        env:
          SUSPECTS: ${{ inputs.suspects }}
        run: |
          status=0
          args=(
            --base-binary
            "$(dirname "$GITHUB_WORKSPACE")/paired-base/build/bench/tess_bench"
            --head-binary
            "$(dirname "$GITHUB_WORKSPACE")/paired-head/build/bench/tess_bench"
            --sentinels bench/sentinels.json
            --mode confirm
            --summary paired-summary.md
            --json paired-report.json
          )
          if [ -n "$SUSPECTS" ]; then
            args+=("--suspects=$SUSPECTS")
          fi
          python3 tools/paired_bench.py "${args[@]}" || status=$?
          [ -f paired-summary.md ] && \
            cat paired-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload paired report
        if: ${{ always() }}
        # upload-artifact v7.0.1.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paired-bench-confirm-${{ github.run_id }}
          path: |
            paired-report.json
            paired-summary.md
          retention-days: 90
