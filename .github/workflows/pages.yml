name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_version:
        description: >-
          Version directory to publish from the selected ref, such as "0.13".
          Supplying it also moves the stable root and "latest" compatibility
          tree,
          unless the currently published latest is numerically newer
          (the deploy-step guard then publishes the tree only).
          Leave empty for an ordinary verification run.
        required: false
        type: string

permissions:
  contents: read

# Pull requests cancel only their own superseded verification. Publishing
# runs stay independently runnable: the publish job's tested FIFO turn orders
# actual attempts instead of GitHub concurrency's lossy one-pending slot, so
# clustered main/tag/dispatch events and reruns are preserved and serialized.
concurrency:
  group: >-
    pages-${{ github.event_name == 'pull_request'
      && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One place decides what, if anything, this run publishes. Pull requests and
  # plain manual runs verify only: they resolve to an empty version, which
  # skips publication and deployment.
  select:
    name: Select version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
      alias: ${{ steps.pick.outputs.alias }}
    steps:
      - name: Pick the version directory and alias
        id: pick
        env:
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.publish_version }}
          EVENT: ${{ github.event_name }}
        run: |
          version=""
          alias=""
          if [ -n "$REQUESTED" ]; then
            # Only a major.minor release tree may be requested: anything
            # else -- "dev" especially, which sort -V ranks above every
            # number and would sail through the deploy-step alias guard --
            # must fail loudly rather than re-point the stable publication.
            if ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+$'
            then
              echo "publish_version must be <major>.<minor>," \
                "got '$REQUESTED'" >&2
              exit 1
            fi
            version="$REQUESTED"
            alias="latest"
          elif [ "$EVENT" != "push" ]; then
            # A dispatch without publish_version verifies only -- even on a
            # tag ref. Otherwise an empty dispatch on a tag would republish
            # it (restaging that ref's robots.txt at the root) instead of
            # doing the documented verification run.
            :
          elif [ "$REF" = "refs/heads/main" ]; then
            # Development snapshot. It never takes the "latest" alias, so the
            # stable root keeps serving the newest release.
            version="dev"
          elif [ "${REF#refs/tags/v}" != "$REF" ]; then
            tag="${REF#refs/tags/}"
            numbers="${tag#v}"
            # A stable release publishes a major.minor tree and moves the
            # latest alias; patches replace the tree. Prerelease tags
            # (v1.0.0-rc.1) publish nothing: /dev/ already tracks the
            # candidate during observation, and latest must keep pointing
            # at the newest stable release.
            if printf '%s' "$numbers" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
            then
              version="${numbers%.*}"
              alias="latest"
            else
              echo "prerelease or malformed tag $tag: skipping publish"
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "alias=$alias" >>"$GITHUB_OUTPUT"
          echo "Publishing version '${version:-<none>}' alias '${alias:-<none>}'"

  build:
    name: Build documentation
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOXYGEN_VERSION: 1.17.0
      DOXYGEN_SHA256: >-
        75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install \
            --require-hashes \
            --requirement requirements-docs.txt

      - name: Install Doxygen
        run: |
          archive="$RUNNER_TEMP/doxygen.tar.gz"
          install_dir="$RUNNER_TEMP/doxygen"
          release="Release_${DOXYGEN_VERSION//./_}"
          asset="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          url="https://github.com/doxygen/doxygen/releases/download"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "$url/$release/$asset"
          echo "$DOXYGEN_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" \
            --directory "$install_dir" --strip-components=1
          installed_version=$("$install_dir/bin/doxygen" --version)
          echo "Installed Doxygen $installed_version"
          test "${installed_version%% *}" = "$DOXYGEN_VERSION"
          echo "$install_dir/bin" >>"$GITHUB_PATH"

      - name: Fetch pinned Mermaid runtime
        run: python3 tools/fetch_mermaid.py

      - name: Verify source-backed documentation
        run: |
          python3 tools/check_doc_snippets.py
          python3 tools/check_doc_versions.py
          python3 tools/check_mermaid.py --browser google-chrome

      - name: Build site
        run: .venv-docs/bin/mkdocs build --strict

      - name: Build API reference
        run: |
          cmake -S . -B build/docs-api \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESS_BUILD_TESTING=OFF \
            -DTESS_BUILD_EXAMPLES=OFF \
            -DTESS_BUILD_BENCHMARKS=OFF \
            -DTESS_BUILD_DOCS=ON \
            -DTESS_ENABLE_ENTT=OFF
          cmake --build build/docs-api --target tess_docs

      - name: Build WebAssembly example
        env:
          EMSCRIPTEN_IMAGE: >-
            emscripten/emsdk:6.0.3@sha256:bb0910e6a18bb9bd7cb31ae4ed40f9073148b78cb2cdb8ea8676454e0d85425c
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" \
            --workdir /src \
            "$EMSCRIPTEN_IMAGE" \
            bash tools/build_web_demo.sh build/site/demo

      - name: Assemble Pages artifact
        run: cp -R build/docs-api/docs/html build/site/api

      # Runs before anything consumes the site and on every pull
      # request, so a wrong hook point or an unclassified page shape
      # fails here rather than after merge. Every downstream copy
      # inherits the stamps: the link-checked site, the uploaded
      # artifact, mike's staged api/demo trees, and the stable root a
      # release assembles from this artifact via --root-source.
      - name: Finalize generated pages
        env:
          SELECTED_VERSION: ${{ needs.select.outputs.version }}
        run: |
          python3 tools/finalize_generated_pages.py build/site \
            --version "${SELECTED_VERSION:-dev}"

      - name: Check generated documentation links
        run: |
          # Doxygen 1.17.0 emits these quick-index links without anchors. Keep
          # each exception target-specific so every other missing anchor fails.
          python3 tools/check_docs_links.py build/site \
            --ignore-missing-anchor api/functions_vars.html#index_b \
            --ignore-missing-anchor api/functions_vars.html#index_c \
            --ignore-missing-anchor api/functions_vars.html#index_d \
            --ignore-missing-anchor api/functions_vars.html#index_r \
            --ignore-missing-anchor api/functions_vars.html#index_s \
            --ignore-missing-anchor api/functions_vars.html#index_m \
            --ignore-missing-anchor api/functions_vars.html#index_n \
            --ignore-missing-anchor api/functions_vars.html#index_e \
            --ignore-missing-anchor api/functions_vars.html#index_f \
            --ignore-missing-anchor api/functions_vars.html#index_o \
            --ignore-missing-anchor api/functions_vars.html#index_u \
            --ignore-missing-anchor api/functions_func_~.html#index_~ \
            --ignore-missing-anchor api/functions_~.html#index_~

      - name: Smoke-test WebAssembly in Chrome
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 \
            --directory build/site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/demo/ >/dev/null && break
            sleep 0.25
          done
          # Fail here, not at the DOM grep, if the server never came up.
          curl --fail --silent http://127.0.0.1:8000/demo/ >/dev/null
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:8000/demo/ >build/web-demo-dom.html
          grep -q 'data-tess-demo="ready"' build/web-demo-dom.html
          grep -q '>Route found<' build/web-demo-dom.html
          python3 tools/wait_for_browser_state.py \
            --browser google-chrome \
            --url http://127.0.0.1:8000/demo/strategies/ \
            --dataset tessStrategies \
            --expected ready \
            --timeout 30 \
            -- \
            --no-sandbox \
            --disable-gpu
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:8000/demo/strategies/ \
            >build/web-strategies-dom.html
          grep -q 'data-tess-strategies="ready"' \
            build/web-strategies-dom.html
          grep -q 'data-cache-hits="1"' build/web-strategies-dom.html
          grep -q 'data-cache-misses="1"' build/web-strategies-dom.html
          grep -q 'data-batch-field-builds="1"' \
            build/web-strategies-dom.html
          grep -q 'data-batch-fallbacks="0"' \
            build/web-strategies-dom.html
          grep -q 'data-field-reached-nodes="211"' \
            build/web-strategies-dom.html
          grep -q 'data-impassable-tiles-per-grid="45"' \
            build/web-strategies-dom.html
          grep -q 'data-distance-field-covered-tiles="211"' \
            build/web-strategies-dom.html
          grep -q 'data-distance-field-third-route="ready"' \
            build/web-strategies-dom.html
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --window-size=1366,768 \
            --virtual-time-budget=10000 \
            --dump-dom \
            http://127.0.0.1:8000/demo/traffic/ \
            >build/web-traffic-dom.html
          grep -q 'data-tess-traffic="ready"' build/web-traffic-dom.html
          grep -q 'C++ update' build/web-traffic-dom.html
          python3 tools/test_web_demo_interactions.py \
            --browser google-chrome \
            --base-url http://127.0.0.1:8000/demo/
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=8000 \
            --dump-dom \
            http://127.0.0.1:8000/demo/colony/ >build/web-colony-dom.html
          grep -q 'data-tess-colony="ready"' build/web-colony-dom.html
          grep -Eq '>Colony (running|planning:)' build/web-colony-dom.html
          # Chromium's webgpu-swiftshader test configuration forces a software
          # adapter and opts test-only WebGPU paths into this trusted smoke.
          # Poll DevTools in wall time: virtual time can race past asynchronous
          # GPU-process work and trigger the page's timeout before it completes.
          python3 tools/wait_for_browser_state.py \
            --browser google-chrome \
            --url http://127.0.0.1:8000/demo/webgpu/ \
            --dataset tessWebgpu \
            --expected ready \
            --timeout 30 \
            -- \
            --no-sandbox \
            --enable-unsafe-webgpu \
            --use-webgpu-adapter=swiftshader \
            --enable-dawn-features=allow_unsafe_apis \
            --disable-dawn-features=use_dxc \
            --enable-webgpu-developer-features \
            --use-gpu-in-tests \
            --enable-accelerated-2d-canvas
          # This poll proves a real software-rendered WebGL frame, so GPU
          # acceleration stays enabled for the diagnostics smoke.
          python3 tools/wait_for_browser_state.py \
            --browser google-chrome \
            --url http://127.0.0.1:8000/demo/diagnostics/ \
            --dataset tessDiagnostics \
            --expected ready \
            --timeout 30 \
            -- \
            --no-sandbox \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader

      # The complete verified site is authoritative for a stable root
      # publication. The publish job also stages its generated API and demos
      # into mike's source tree because mike has no prebuilt-directory mode.
      - name: Upload built documentation
        if: needs.select.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-documentation
          path: build/site
          retention-days: 1

  publish:
    name: Publish version tree
    if: needs.select.outputs.version != ''
    needs: [select, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The only write token in this workflow. It commits the built tree to the
    # storage branch; it never touches main and never publishes a release.
    permissions:
      actions: read
      contents: write
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not persisted, matching every other checkout here: a token in
          # .git/config is readable by anything the job later runs. The final
          # publication push authenticates for its own commands instead.
          persist-credentials: false

      - name: Wait for the publication turn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/wait_for_publish_turn.py
          --repo "$GITHUB_REPOSITORY"
          --workflow pages.yml
          --run-id "$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install \
            --require-hashes \
            --requirement requirements-docs.txt

      - name: Fetch pinned Mermaid runtime
        run: python3 tools/fetch_mermaid.py

      - name: Download built documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-documentation
          path: build/generated

      - name: Stage generated trees inside the documentation source
        run: |
          # mkdocs copies non-Markdown files in docs/ verbatim, which is how
          # the API reference and demos reach mike's build. Both are generated
          # and gitignored, matching the fetched Mermaid runtime.
          cp -R build/generated/api docs/api
          cp -R build/generated/demo docs/demo
          test -f docs/api/index.html
          test -d docs/demo/colony

      - name: Deploy version tree
        env:
          VERSION: ${{ needs.select.outputs.version }}
          ALIAS: ${{ needs.select.outputs.alias }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Checkout did not persist credentials, so authorize this job's own
          # remote commands. Reads are authorized too: were the repository
          # ever made private, an anonymous fetch would fail and the storage
          # branch would look absent rather than unreadable.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' \
            "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git config --local "http.extraheader" "$auth"

          # mike reads the existing branch to preserve every other version.
          # No `|| true`: the branch exists, so a failed fetch means mike
          # would commit onto an orphan and drop every published version.
          git fetch --no-tags --depth=1 origin gh-pages
          git branch --force gh-pages FETCH_HEAD

          # mike shells out to mkdocs, so the virtualenv has to be on PATH
          # rather than only addressed by absolute path.
          export PATH="$PWD/.venv-docs/bin:$PATH"

          # A patch tag on an older minor line must not re-point `latest`
          # or the stable root backward. Keep the tree publish, but drop
          # the alias when the currently aliased version is numerically
          # newer than this one.
          if [ -n "$ALIAS" ]; then
            current="$(git show FETCH_HEAD:versions.json 2>/dev/null \
              | python -c 'import json, sys; e = json.load(sys.stdin); print(next((v["version"] for v in e if "latest" in v.get("aliases", [])), ""))' \
              || true)"
            if [ -n "$current" ] && [ "$current" != "$VERSION" ]; then
              newest="$(printf '%s\n%s\n' "$current" "$VERSION" \
                | sort -V | tail -1)"
              if [ "$newest" = "$current" ]; then
                echo "published latest $current is newer than $VERSION;" \
                  "publishing the tree without moving the alias"
                ALIAS=""
              fi
            fi
          fi

          # Keep a copy alias so old non-HTML /latest/ resources remain
          # available. The publication helper replaces alias HTML with exact
          # root redirects after making the root tree authoritative.
          deploy_names=("$VERSION")
          if [ -n "$ALIAS" ]; then
            deploy_names+=("$ALIAS")
          fi
          mike deploy --update-aliases \
            --alias-type copy \
            --branch gh-pages \
            --title "$VERSION" \
            "${deploy_names[@]}"

          rm -rf build/pages
          git worktree add build/pages gh-pages

          root_args=()
          if [ -n "$ALIAS" ]; then
            root_args=(--root-source build/generated)
          fi
          python3 tools/publish_docs_root.py sync \
            build/pages "${root_args[@]}"
          # Jekyll would otherwise drop Doxygen's underscore-prefixed assets.
          touch build/pages/.nojekyll

          # Root-current content and compatibility redirects are persistent
          # publication state. Commit them locally before applying
          # artifact-only indexing metadata to immutable version trees.
          git -C build/pages add --all
          if ! git -C build/pages diff --cached --quiet; then
            git -C build/pages commit -m \
              "docs: assemble stable root publication"
          fi
          python3 tools/publish_docs_root.py prepare-artifact build/pages
          python3 tools/publish_docs_root.py check build/pages
          # Nothing reaches persistent storage until the complete served tree
          # has passed the same final checks as the Pages artifact.
          git -C build/pages push origin HEAD:gh-pages
          git config --local --unset "http.extraheader"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

  deploy:
    name: Deploy documentation
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
