version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Version updates are off for pip. requirements-dev.txt and
  # requirements-docs.txt are universal uv compiles with a fixed package-index
  # cutoff (docs/dependencies.md). Dependabot rewrites them for one platform,
  # which drops the win32 and Python-version entries the lock tests require,
  # so none of its lock updates can pass. Security updates are unaffected by
  # this limit and still open; apply them by advancing the cutoff with
  # tools/compile_requirements.sh and tools/compile_docs_requirements.sh.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
