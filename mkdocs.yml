site_name: tess
site_description: >-
  Header-only C++20 library for grid pathfinding, tile-world storage, and
  deterministic simulation
site_url: https://tess.owx.dev/
repo_url: https://github.com/kindjie/tess
repo_name: kindjie/tess
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/site

theme:
  name: material
  custom_dir: overrides
  logo: assets/tess-symbol-header.svg
  favicon: assets/tess-symbol.svg
  # No web-font fetch: headings load a vendored face via extra.css; body
  # text uses the system stack.
  font: false
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  # Declaring any plugin replaces mkdocs' default list, so search is named
  # explicitly here rather than inherited.
  - search
  - mike

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Getting started: getting-started.md
      - Installation: packaging.md
      - Examples: examples.md
  - Decision guide:
      - guide/README.md
      - Residency: guide/residency.md
      - Writes: guide/writes.md
      - Pathfinding strategy: guide/pathfinding.md
      - Congestion pricing: guide/congestion.md
      - Interactive comparison: pathfinding-strategy-comparison.md
      - Topology and precheck: guide/topology.md
      - Entities and ECS: guide/entities.md
      - Presentation: guide/presentation.md
      - Diagnostics guide: guide/diagnostics.md
  - Concepts:
      - architecture/README.md
      - Terminology: terminology.md
      - Compatibility evidence: architecture/compatibility.md
      - Shapes: architecture/shape.md
      - Storage: architecture/storage.md
      - Persistence: architecture/persistence.md
      - Block kernels: architecture/block.md
      - Exception-free builds: architecture/no-exceptions.md
      - Spatial queries: architecture/query.md
      - Maintenance experiments: architecture/maintenance.md
      - Pathfinding: architecture/path.md
      - Topology: architecture/topology.md
      - Spatial coordination: architecture/spatial-coordination.md
      - Queued operations: architecture/queued-operations.md
      - Simulation and scheduling: architecture/simulation.md
      - ECS integration: architecture/ecs.md
      - Diagnostics architecture: architecture/diagnostics.md
      - GPU interface: architecture/gpu.md
  - API reference: https://tess.owx.dev/api/
  - Performance: performance.md
  - Use cases: use-cases.md
  - Project:
      - Integration policy: integration-policy.md
      - Upgrade to 1.0: upgrade-1.0.md
      - Roadmap: roadmap.md
      - Support: support.md
      - For agents: for-agents.md

exclude_docs: |
  /README.md
  /api-main.md
  /assets/fonts/README.md
  /dependencies.md
  /git-hooks.md
  /history.md
  /hosting.md
  /releasing.md
  /style.md
  decisions/
  doxygen-awesome/
  planning/
  tdd/

watch:
  - includes

copyright: Copyright &copy; tess contributors
