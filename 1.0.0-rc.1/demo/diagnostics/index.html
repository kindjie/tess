<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>tess diagnostics demo</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script defer src="tess-diagnostics.js"></script>
    <script defer src="app.js"></script>
  <link rel="canonical" href="https://tess.owx.dev/1.0.0-rc.1/demo/diagnostics/">
<meta name="description" content="Diagnostics demo: tess instrumentation counters and trace overlays on a live simulation in WebAssembly.">
<meta property="og:title" content="tess diagnostics demo">
<meta property="og:url" content="https://tess.owx.dev/1.0.0-rc.1/demo/diagnostics/">
<meta property="og:image" content="https://tess.owx.dev/assets/tess-social-preview.png">
</head>
  <body>
    <header>
      <a class="brand" href="../../">
        <img src="logo.svg" alt="tess">
      </a>
      <div>
        <p class="eyebrow">WebAssembly integration demo</p>
        <h1>Live diagnostics</h1>
        <p>
          Real path and queued workloads rendered by the reference Dear ImGui
          panels. Allocation figures are consumer-instrumented.
        </p>
      </div>
    </header>
    <main>
      <section class="controls" aria-labelledby="controls-title">
        <h2 id="controls-title">Accessible controls</h2>
        <label>
          <input id="paused" type="checkbox">
          Pause workload
        </label>
        <label for="intensity">Searches per frame</label>
        <input id="intensity" type="range" min="1" max="32" value="4">
        <output id="intensity-value" for="intensity">4</output>
        <label for="selected-x">Selected x</label>
        <input id="selected-x" type="number" min="0" max="31" value="4">
        <label for="selected-y">Selected y</label>
        <input id="selected-y" type="number" min="0" max="23" value="4">
        <label>
          <input id="passable" type="checkbox" checked>
          Selected tile is passable
        </label>
        <p id="status" role="status" aria-live="polite">
          Loading WebAssembly diagnostics…
        </p>
      </section>
      <section class="viewport" aria-labelledby="canvas-title">
        <h2 id="canvas-title">Dear ImGui panels</h2>
        <canvas id="canvas" tabindex="0"
                aria-label="Interactive Dear ImGui diagnostics panels"></canvas>
      </section>
    </main>
    <footer>
      Dear ImGui is distributed under the
      <a href="third-party-imgui-LICENSE.txt">MIT license</a>.
    </footer>
  </body>
</html>
